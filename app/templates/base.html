<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seeker</title>
{% block head %}{% endblock %}
<style>
:root { color-scheme: light dark;
  --ok: #2e7d32; --warn: #b26a00; --bad: #b3413a; --muted: #8888;
  --card-bg: color-mix(in srgb, canvas 96%, canvastext 4%); }
body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 0 auto;
       padding: 0.75rem; line-height: 1.45; }
nav { display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: baseline;
      padding: 0.5rem 0; border-bottom: 1px solid #8884; margin-bottom: 1rem; }
nav a { text-decoration: none; font-weight: 600; opacity: 0.75; }
nav a.here { opacity: 1; border-bottom: 2px solid; padding-bottom: 0.1rem; }
nav .brand { font-weight: 800; letter-spacing: 0.05em; opacity: 0.6; }
.card { border: 1px solid #8885; border-left-width: 5px; border-radius: 8px;
        padding: 0.9rem; margin-bottom: 0.9rem; background: var(--card-bg); }
.card.err { border-left-color: var(--bad); }
.card h3 { margin: 0 0 0.25rem; padding-right: 3.2rem; }
.meta { font-size: 0.85rem; opacity: 0.75; }
.pitch { margin: 0.5rem 0; }
.concerns { font-size: 0.9rem; opacity: 0.85; margin: 0.3rem 0; }
.score { float: right; font-size: 1.35rem; font-weight: 800;
         padding: 0.05rem 0.5rem; border-radius: 8px; }
.score-hi  { color: var(--ok);   border: 2px solid var(--ok); }
.score-mid { color: var(--warn); border: 2px solid var(--warn); }
.score-lo  { color: var(--muted); border: 2px solid var(--muted); }
.scam-high, .scam-medium { color: var(--bad); font-weight: 700; }
.badge { font-size: 0.75rem; border: 1px solid #8886; border-radius: 10px;
         padding: 0.05rem 0.55rem; white-space: nowrap; }
.badge.st-error { color: var(--bad); border-color: var(--bad); }
.badge.st-pending_extract, .badge.st-pending_eval { color: var(--warn); border-color: var(--warn); }
.badge.st-pending_user_review { color: var(--ok); border-color: var(--ok); }
.badge.st-applied { color: var(--ok); border-color: var(--ok); font-weight: 700; }
.actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; align-items: stretch; }
button, .btn { padding: 0.55rem 1.1rem; border-radius: 6px; border: 1px solid #8886;
         cursor: pointer; font-size: 0.95rem; background: var(--card-bg);
         color: inherit; text-decoration: none; display: inline-block; }
button.approve { background: var(--ok); color: white; border: none; }
button.reject { background: var(--bad); color: white; border: none; }
button.subtle { font-size: 0.8rem; padding: 0.3rem 0.7rem; opacity: 0.8; }
textarea, input[type=text], input[type=url], select {
  width: 100%; box-sizing: border-box; padding: 0.5rem; border-radius: 6px;
  border: 1px solid #8886; font-size: 1rem; background: canvas; color: inherit; }
label { font-size: 0.9rem; font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
td, th { border: 1px solid #8884; padding: 0.35rem 0.5rem; text-align: left; }
.msg { background: color-mix(in srgb, var(--ok) 15%, canvas); border: 1px solid var(--ok);
       padding: 0.5rem 0.8rem; border-radius: 6px; margin-bottom: 1rem; }
details.posting { margin-top: 0.4rem; }
details.posting summary { cursor: pointer; font-size: 0.85rem; opacity: 0.75; }
details.posting .desc { max-height: 22rem; overflow-y: auto; font-size: 0.88rem;
  white-space: pre-wrap; border: 1px solid #8884; border-radius: 6px;
  padding: 0.6rem; margin-top: 0.4rem; }
.spend-bar { height: 0.6rem; border-radius: 4px; background: #8883; overflow: hidden; margin: 0.4rem 0 1rem; }
.spend-bar > div { height: 100%; background: var(--ok); }
.spend-bar.over > div { background: var(--bad); }
</style>
</head>
<body>
{% set path = request.url.path if request else '' %}
<nav>
  <span class="brand">SEEKER</span>
  <a href="/" {% if path == '/' %}class="here"{% endif %}>Review</a>
  <a href="/applications" {% if path.startswith('/applications') %}class="here"{% endif %}>Applications</a>
  <a href="/jobs" {% if path.startswith('/jobs') %}class="here"{% endif %}>Jobs</a>
  <a href="/companies" {% if path.startswith('/companies') %}class="here"{% endif %}>Companies</a>
  <a href="/submit" {% if path.startswith('/submit') %}class="here"{% endif %}>Submit</a>
  <a href="/profiles" {% if path.startswith('/profiles') %}class="here"{% endif %}>Profiles</a>
  <a href="/usage" {% if path.startswith('/usage') %}class="here"{% endif %}>Usage</a>
  <a href="/status" {% if path.startswith('/status') %}class="here"{% endif %}>Status</a>
</nav>
{% block content %}{% endblock %}
<script>
// Clipboard helper. navigator.clipboard only exists in a secure context
// (HTTPS or localhost); over plain HTTP on the LAN — especially iOS Safari —
// it's undefined, so fall back to a hidden-textarea execCommand copy. Returns
// a Promise so call sites can .then()/.catch() uniformly.
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.contentEditable = 'true';         // iOS: makes the field selectable
    ta.readOnly = false;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    var range = document.createRange();
    range.selectNodeContents(ta);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ta.setSelectionRange(0, text.length); // iOS needs the explicit range
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error('copy failed'));
  });
}
</script>
</body>
</html>
